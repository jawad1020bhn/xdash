<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#FAF9FC" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="A personal visual archive of everything you saved on X." />
  <link rel="manifest" href="manifest.webmanifest?v=1" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="X Archive" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235B4CF5'/%3E%3Cpath d='M6 7.5h12v2H6v-2Zm0 4h12v5.5a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-5.5Z' fill='white'/%3E%3C/svg%3E" />
  <title>Discover · X Bookmarks</title>

  <!-- Shared Material 3 Expressive layer: type, tokens, component mechanics.
       ?v= busts the cache when assets change; the extension and local previews
       otherwise serve stale CSS/JS. -->
  <link rel="stylesheet" href="m3e/fonts.css?v=11" />
  <link rel="stylesheet" href="m3e/tokens.css?v=11" />
  <link rel="stylesheet" href="m3e/components.css?v=11" />

  <!-- Editorial Visual Archive: the product's own voice, layered on top. -->
  <link rel="stylesheet" href="css/foundation.css?v=11" />
  <link rel="stylesheet" href="css/workspaces.css?v=11" />
  <link rel="stylesheet" href="css/viewer.css?v=11" />
  <link rel="stylesheet" href="css/settings.css?v=11" />
  <link rel="stylesheet" href="css/mobile.css?v=11" />
  <link rel="stylesheet" href="css/lock.css?v=11" />
</head>
<body class="is-booting">
  <a class="skip" href="#stage">Skip to your archive</a>

  <div class="app">
    <!-- Navigation rail (desktop / tablet). Collapses to .navbar below 720px. -->
    <nav class="rail" id="rail" aria-label="Workspaces"></nav>

    <div class="work">
      <header class="topbar" id="topbar" data-scrolled="false"></header>
      <main class="stage" id="stage" tabindex="-1"></main>
    </div>
  </div>

  <!-- Bottom navigation (compact windows only). -->
  <nav class="navbar" id="navbar" aria-label="Workspaces"></nav>

  <!-- One live region for every transient message. -->
  <div class="m3e-snackbar" id="snackbar" role="status" aria-live="polite" data-open="false">
    <span class="m3e-snackbar__text"></span>
    <button type="button" class="m3e-snackbar__action" hidden></button>
  </div>

  <!-- Shared layer: colour engine, theme runtime, interaction primitives,
       media helpers, video controls. Order matters — theme.js needs color.js. -->
  <script src="m3e/color.js?v=11"></script>
  <script src="m3e/theme.js?v=11"></script>
  <script src="m3e/interactions.js?v=11"></script>
  <script src="m3e/media.js?v=11"></script>
  <script src="m3e/video-controls.js?v=11"></script>

  <!-- Data layer. demo.js only seeds anything outside the extension. -->
  <script src="js/demo.js?v=11"></script>
  <script src="js/store.js?v=11"></script>
  <script src="js/library.js?v=11"></script>

  <!-- Product layer. -->
  <script src="js/ui.js?v=11"></script>
  <script src="js/mobile.js?v=11"></script>
  <script src="js/state.js?v=11"></script>
  <script src="js/card.js?v=11"></script>
  <script src="js/viewer.js?v=11"></script>
  <script src="js/views/discover.js?v=11"></script>
  <script src="js/views/library.js?v=11"></script>
  <script src="js/views/watch.js?v=11"></script>
  <script src="js/views/settings.js?v=11"></script>
  <script src="js/views/manage.js?v=11"></script>
  <script src="js/views/capture.js?v=11"></script>
  <script src="js/lock.js?v=11"></script>
  <script src="js/app.js?v=11"></script>
  <script src="js/pwa.js?v=11"></script>
</body>
</html>
