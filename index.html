<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08080b" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
<meta name="color-scheme" content="dark light" />
<meta name="description" content="A fast, private, offline-first visual dashboard for everything you saved on X." />
<meta name="apple-mobile-web-app-title" content="Archive" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="alternate icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://pbs.twimg.com" crossorigin />
<link rel="preconnect" href="https://video.twimg.com" crossorigin />

<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/components.css" />
<link rel="stylesheet" href="styles/views.css" />

<script>
  /* Theme before first paint: reads the same storage key the app uses and
     applies every document-level preference, so nothing flashes or jumps. */
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem("xDashboardPrefs") || "{}");
      var root = document.documentElement;
      var dark = (p.themeMode || "system") === "system"
        ? matchMedia("(prefers-color-scheme: dark)").matches
        : p.themeMode === "dark";
      root.dataset.theme = dark ? "dark" : "light";
      if (p.density) root.dataset.density = p.density;
      if (p.aspect) root.dataset.aspect = p.aspect;
      if (p.motion === "reduced") root.dataset.motion = "reduced";
      if (p.blurMedia) root.dataset.blur = "on";
    } catch (e) { /* first run: stylesheet defaults */ }
  })();
</script>
</head>

<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="shell" id="shell" hidden>
  <aside class="side" id="side">
    <div class="side__brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 3.5h12A1 1 0 0 1 19 4.5v16l-7-3.8-7 3.8v-16a1 1 0 0 1 1-1Z"/></svg>
      </span>
      <span class="side__word">Archive</span>
    </div>
    <nav class="side__nav" id="sideNav" aria-label="Sections"></nav>
    <div class="side__foot" id="sideFoot"></div>
  </aside>

  <header class="topbar" id="topbar" data-scrolled="false">
    <span class="topbar__title"><span class="dot" aria-hidden="true"></span><span id="topTitleText">Home</span></span>
    <button class="topbar__search" id="openPalette" type="button" aria-keyshortcuts="Meta+K Control+K">
      <span class="topbar__search-icon" aria-hidden="true"></span>
      <span class="topbar__search-label">Search</span>
      <kbd class="kbd" aria-hidden="true">/</kbd>
    </button>
    <div class="topbar__acts">
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch theme"></button>
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Archive menu" aria-haspopup="dialog"></button>
    </div>
  </header>

  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

  <main class="stage" id="main" tabindex="-1"></main>
</div>

<!-- Skeleton: painted by the stylesheet alone, geometry matched to the real
     dashboard so content swaps in with zero layout shift. -->
<div class="boot" id="boot" aria-hidden="true">
  <div class="sk" style="height:56px; width:min(340px,70%)"></div>
  <div class="boot__kpis">
    <div class="sk sk--kpi"></div><div class="sk sk--kpi"></div>
    <div class="sk sk--kpi"></div><div class="sk sk--kpi"></div>
  </div>
  <div class="sk sk--wide"></div>
  <div class="boot__grid">
    <div class="sk sk--tile"></div><div class="sk sk--tile"></div><div class="sk sk--tile"></div>
    <div class="sk sk--tile"></div><div class="sk sk--tile"></div><div class="sk sk--tile"></div>
  </div>
</div>

<!-- Hard failure surface. [hidden] is enforced in base.css, so this can never
     paint by accident the way v2's did. -->
<div class="crash" id="crash" hidden>
  <div class="crash__card">
    <h1>Something went wrong while opening your archive</h1>
    <p id="crashMsg" class="crash__msg"></p>
    <pre id="crashStack" class="crash__stack" hidden></pre>
    <div class="crash__actions">
      <button class="btn btn--pri" id="crashRetry" type="button">Try again</button>
      <button class="btn" id="crashReset" type="button">Reset local data</button>
    </div>
    <p class="crash__hint">Your saved bookmarks are untouched — this is a rendering error, not data loss.</p>
  </div>
</div>

<noscript>
  <div class="crash"><div class="crash__card">
    <h1>JavaScript is required</h1>
    <p>Your archive is indexed and searched entirely on this device, which needs JavaScript enabled.</p>
  </div></div>
</noscript>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
  if (location.protocol === "file:") {
    document.getElementById("boot").hidden = true;
    var c = document.getElementById("crash");
    c.hidden = false;
    document.getElementById("crashMsg").textContent =
      "This app was opened directly from the file system, so the browser blocks its modules and its data file.";
    document.getElementById("crashStack").hidden = false;
    document.getElementById("crashStack").textContent = "Serve the folder over http instead:\n\n  npm start\n\nthen open the printed address.";
    document.getElementById("crashRetry").hidden = true;
  }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
