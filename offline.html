<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline · X Bookmarks</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #faf9fc;
      color: #15151b;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0b0b0f; color: #f3f3f8; }
    }
    main { max-width: 380px; text-align: center; display: grid; justify-items: center; gap: 14px; }
    .glyph {
      width: 56px; height: 56px;
      display: grid; place-items: center;
      border-radius: 16px;
      background: #5b4cf5;
    }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
    p { margin: 0; opacity: 0.72; line-height: 1.6; }
    button {
      margin-top: 8px;
      height: 40px;
      padding-inline: 20px;
      border: none;
      border-radius: 10px;
      background: #5b4cf5;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(0.94); }
  </style>
</head>
<body>
  <main>
    <div class="glyph" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="#fff" aria-hidden="true">
        <path d="M5 3h14a1 1 0 0 1 1 1v17l-8-4-8 4V4a1 1 0 0 1 1-1Z"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>
      Your archive lives in this browser and your saved media is cached,
      but this page hasn't been stored yet. Reconnect once and it will
      open instantly — even with no connection.
    </p>
    <button type="button">Try again</button>
  </main>
  <script>
    document.querySelector("button").addEventListener("click", () => location.reload());
  </script>
</body>
</html>
