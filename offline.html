<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c0a09" />
<meta name="color-scheme" content="dark light" />
<title>Offline · Archive</title>
<link rel="icon" href="icons/icon-192.png" />
<style>
  :root {
    color-scheme: dark light;
    --bg: #0c0a09; --surface: #161311; --text: #f4f1ea; --text-2: #aaa49a;
    --line: #26211d; --accent: #ff4e2e; --on-accent: #fff;
    --serif: ui-serif, "Iowan Old Style", Palatino, Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f2ec; --surface: #fffdf8; --text: #171310; --text-2: #57504a; --line: #e2dccf; --accent: #d9381c; --on-accent: #fff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(420px, 100%); padding: 36px 32px; text-align: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
    border-top: 3px solid var(--accent);
  }
  .mark {
    display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 20px;
    border-radius: 15px; background: var(--accent); color: var(--on-accent);
  }
  .kicker {
    display: block; margin-bottom: 10px;
    font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase;
    color: var(--text-2);
  }
  h1 { margin: 0 0 8px; font-family: var(--serif); font-size: 27px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0 0 24px; color: var(--text-2); font-size: 14.5px; line-height: 1.55; }
  button {
    min-height: 46px; padding: 0 26px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 700; font-size: 14px;
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <main class="card">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M5 3h14a1 1 0 0 1 1 1v17l-8-4.2L4 21V4a1 1 0 0 1 1-1Z"/></svg>
    </span>
    <span class="kicker">Intermission</span>
    <h1>You are offline</h1>
    <p>
      The shell of your archive is cached here, but the data file was not reached.
      Reconnect and try again — anything already loaded in this tab is untouched.
    </p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
